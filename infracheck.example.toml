# InfraCheck settings. Every value below is the built-in default; copy this file, keep what you
# change, and pass it with:  infracheck scan -f urls.txt --config infracheck.toml
# Command-line options override the file.

[scan]
# Checks to run. "exposure" (open service ports) is opt-in; list it here or use --checks all.
checks = ["transport", "headers", "csp", "cookies", "cors", "versions", "methods", "errors", "spoofing"]
timeout = 10.0          # seconds per request
concurrency = 8         # targets scanned in parallel
proxy = ""              # HTTP proxy as host:port (CONNECT is used for HTTPS)
ca_file = ""            # extra trusted CA certificates (PEM), e.g. your internal CA
offline = false         # true: no end-of-life lookups at endoflife.date

[methods]
# true: test PUT/DELETE by uploading one uniquely named text file, reading it back and deleting it.
# Only on systems you may write to.
allow_write_probes = false

[errors]
# A sentence your organisation's standard error page contains; pages without it are reported (info).
expected_marker = ""

[spoofing]
# Client addresses the spoofing check claims to be: the addresses your access rules trust.
client_ips = ["127.0.0.1", "10.0.0.1", "172.16.0.1", "192.168.1.1"]

[exposure]
# Ports that should not be reachable from where the scan runs.
ports = [21, 22, 23, 445, 1433, 1521, 2375, 3306, 3389, 5432, 5900, 6379, 9200, 11211, 27017]

[report]
formats = ["csv", "json", "xlsx"]   # Excel needs the openpyxl package
output_dir = ""                     # empty = ./infracheck-report-<date>-<time>
save_evidence = true                # saved responses in <report>/evidence/
