[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "infracheck"
version = "2.0.0"
description = "Checks web-facing hosts for common security weaknesses: TLS, headers, CSP, cookies, CORS, methods, error pages, versions, client-IP spoofing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Faizan Ali" }]
dependencies = []  # the scanner uses the standard library only

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["openpyxl>=3.1", "pytest>=8", "cryptography>=42"]

[project.scripts]
infracheck = "infracheck.cli:main"

[tool.setuptools.packages.find]
include = ["infracheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
